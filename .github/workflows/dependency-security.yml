name: Check dependency security
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json, package-lock.json, .github/workflows/dependency-security.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
